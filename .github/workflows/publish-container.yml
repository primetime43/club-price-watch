name: Publish container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Check types and tests
        working-directory: source
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          file: source/docker/Dockerfile
          build-args: SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          platforms: linux/amd64
          load: true
          tags: club-price-watch:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container API
        run: |
          docker run -d --rm --name cpw-verify -p 127.0.0.1:3301:3000 club-price-watch:verify
          node --experimental-strip-types source/scripts/smoke-container.ts
      - name: Stop verification container
        if: always()
        run: docker rm -fv cpw-verify || true
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker tag club-price-watch:verify "$IMAGE:latest"
          docker tag club-price-watch:verify "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:latest"
